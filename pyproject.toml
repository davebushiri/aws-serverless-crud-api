[project]
name = "items-crud-api"
version = "0.1.0"
description = "Serverless items CRUD API: API Gateway HTTP API, AWS Lambda (Python) and DynamoDB, defined with AWS SAM."
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "scripts"]
testpaths = ["tests"]
# Integration tests need the local stack (`make local-up`); run them with `make test-integration`.
addopts = "-ra -m 'not integration'"
markers = ["integration: needs DynamoDB Local and sam local start-api running"]
